name: juejin-daily-sign

on:
  schedule:
    # 每天 09:00 北京时间（UTC+8）执行，对应 UTC 01:00
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: juejin-daily-sign
  cancel-in-progress: false

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 掘金签到 + 免费抽奖 + 发邮件
        env:
          JUEJIN_COOKIE: ${{ secrets.JUEJIN_COOKIE }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_AUTH_CODE: ${{ secrets.SMTP_AUTH_CODE }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python juejin_sign.py
