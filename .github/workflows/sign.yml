name: Juejin Auto Sign - Selenium

on:
  schedule:
    - cron: '20 00 * * *'   # 中国时间8点20
  workflow_dispatch:

jobs:
  sign:
    # 建议暂时固定到 24.04，避免 ubuntu-latest 自动迁移到 26.04 带来的不确定性
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v7
      with:
        ref: 'master'
    
    - name: 设置Python环境
      uses: actions/setup-python@v7
      with:
        python-version: '3.10'
    
    - name: 安装Chrome和ChromeDriver
      run: |
        # 1. 用新版密钥方式安装 Chrome（适配 Ubuntu 24.04+）
        wget -qO- https://dl.google.com/linux/linux_signing_key.pub | sudo gpg --dearmor -o /usr/share/keyrings/google-chrome-keyring.gpg
        echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome-keyring.gpg] https://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
        sudo apt-get update
        sudo apt-get install -y google-chrome-stable
        
        # 2. 安装 webdriver-manager
        pip install webdriver-manager
    
    - name: 安装Python依赖
      run: |
        python -m pip install --upgrade pip
        pip install selenium webdriver-manager
    
    - name: 运行签到脚本
      env:
        JUEJIN_COOKIE: ${{ secrets.JUEJIN_COOKIE }}
        EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        EMAIL_TO: ${{ secrets.EMAIL_TO }}
        SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
        SMTP_PORT: ${{ secrets.SMTP_PORT }}
      run: |
        python juejin_selenium_final.py
